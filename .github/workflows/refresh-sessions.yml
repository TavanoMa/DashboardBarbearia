name: Refresh AppBarber Sessions

# Plano B: quando uma loja para de trazer dados, faz o login de novo sozinho
# (num navegador de verdade, no site do AppBarber, onde o reCAPTCHA é aceito)
# e grava o cookie novo no Vercel KV.
#
# Não mexe em loja saudável. Manter a sessão viva é trabalho do ping em
# /api/cron/keepalive (cron externo a cada 5 min) — o agendamento do GitHub
# atrasa horas e não serve para isso.

on:
  schedule:
    - cron: "23 * * * *" # de hora em hora (o GitHub costuma atrasar)
  workflow_dispatch:
    inputs:
      force:
        description: "Refazer o login mesmo com as lojas saudáveis (para testar o robô)"
        type: boolean
        default: false

env:
  APP_URL: https://dashboard-two-teal-35.vercel.app

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Alguma loja precisa de conserto?
        id: check
        env:
          HAS_SECRETS: ${{ secrets.APPBARBER_ACCOUNTS != '' && secrets.KV_REST_API_URL != '' && secrets.KV_REST_API_TOKEN != '' }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Robô desligado: cadastre os secrets APPBARBER_ACCOUNTS, KV_REST_API_URL e KV_REST_API_TOKEN."
            echo "need=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "need=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -s --max-time 40 "$APP_URL/api/auth/status" || true)
          NEED=$(node -e '
            let j = {};
            try { j = JSON.parse(process.argv[1]); } catch {}
            const s = Array.isArray(j.stores) ? j.stores : [];
            const ok = s.length > 0 && s.every((x) => x.status === "active");
            console.log(ok ? "false" : "true");
          ' "$STATUS")
          echo "Lojas saudáveis? $([ "$NEED" = "false" ] && echo sim || echo não)"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.need == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check.outputs.need == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        if: steps.check.outputs.need == 'true'
        run: |
          npm ci
          # playwright-extra + plugin stealth escondem marcas de automação do navegador;
          # ajudam a passar no reCAPTCHA v3 do AppBarber a partir de IPs de datacenter.
          npm install --no-save playwright@1 playwright-extra@4 puppeteer-extra-plugin-stealth@2
          npx playwright install --with-deps chromium

      - name: Consertar sessões
        if: steps.check.outputs.need == 'true'
        env:
          APPBARBER_ACCOUNTS: ${{ secrets.APPBARBER_ACCOUNTS }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force }}
        run: node scripts/refresh-appbarber-sessions.mjs
