<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Cacique's — Sync</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171b23;
      --border: #2a2f3a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #d4af37;
      --ok: #10b981;
      --warn: #f59e0b;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 14px;
      letter-spacing: 0.3px;
      color: var(--accent);
    }
    .sub { color: var(--muted); font-size: 11px; margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
    input, select, button {
      width: 100%;
      padding: 7px 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row > * { flex: 1; }
    button.primary {
      background: var(--accent);
      color: #0e1116;
      border: 0;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .status {
      margin-top: 14px;
      padding: 9px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 12px;
    }
    .status.ok { border-color: var(--ok); color: #d1fae5; }
    .status.warn { border-color: var(--warn); color: #fef3c7; }
    .status.error { border-color: var(--error); color: #fee2e2; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--muted);
      vertical-align: middle;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.error { background: var(--error); }
    .time { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .toggle { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .toggle input { width: auto; }
  </style>
</head>
<body>
  <h1>Sync AppBarber</h1>
  <div class="sub">Envia o cookie da sua sessão pro dashboard financeiro.</div>

  <label>URL do Dashboard</label>
  <input id="dashboardUrl" placeholder="https://dashboard-...vercel.app" />

  <label>Token de sincronização</label>
  <input id="syncToken" type="password" placeholder="cole o token aqui" />

  <label>Esta sessão do Chrome é da loja:</label>
  <select id="storeId"><option value="">—</option></select>

  <div class="toggle">
    <input type="checkbox" id="autoSync" checked />
    <label for="autoSync" style="margin:0;">Sincronizar automaticamente ao logar</label>
  </div>

  <div class="row">
    <button class="primary" id="btnSync">Sincronizar agora</button>
    <button class="ghost" id="btnSave">Salvar</button>
  </div>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="msg">Carregando…</span>
    <div class="time" id="when"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
